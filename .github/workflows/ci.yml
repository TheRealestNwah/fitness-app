name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip the macOS build. A job skipped by `if:` still
  # counts as passing for the required "Build & test" check, so those PRs
  # can merge without waiting ~20 minutes.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  # Lint, build and unit tests. The UI tests run in parallel shards below, and
  # the `ios` gate job at the end reports the required "Build & test" check.
  unit-tests:
    name: Lint & unit tests (iOS Simulator)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Lint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Newest iOS runtime first, so iOS 26 code paths are exercised.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries | map(select(.key | test("iOS-[0-9]+")))
                | sort_by(.key | capture("iOS-(?<v>[0-9]+)").v | tonumber) | reverse
                | .[].value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator: $UDID"
          echo "device=$UDID" >> "$GITHUB_OUTPUT"
          # Boot it now: a cold first boot of a new runtime can outlast the UI tests' launch timeout.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project FitnessApp.xcodeproj \
            -scheme FitnessApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project FitnessApp.xcodeproj \
            -scheme FitnessApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build \
            -skip-testing:FitnessAppUITests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "Test Case|error:|failed|passed|\*\*" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log

  ui-tests:
    name: UI tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Raising this adds shards; .github/scripts/ui-test-shard.sh splits the classes.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Pick this shard's test classes
        id: classes
        run: |
          ARGS=$(.github/scripts/ui-test-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}" | tr '\n' ' ')
          echo "Shard ${{ matrix.shard }}: $ARGS"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Pick an iPhone simulator
        if: steps.classes.outputs.args != ''
        id: sim
        run: |
          # Newest iOS runtime first, so iOS 26 code paths are exercised.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries | map(select(.key | test("iOS-[0-9]+")))
                | sort_by(.key | capture("iOS-(?<v>[0-9]+)").v | tonumber) | reverse
                | .[].value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator: $UDID"
          echo "device=$UDID" >> "$GITHUB_OUTPUT"
          # Boot it now: a cold first boot of a new runtime can outlast the UI tests' launch timeout.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build
        if: steps.classes.outputs.args != ''
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project FitnessApp.xcodeproj \
            -scheme FitnessApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: unre|BUILD|Compiling|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: UI tests
        if: steps.classes.outputs.args != ''
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project FitnessApp.xcodeproj \
            -scheme FitnessApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build \
            ${{ steps.classes.outputs.args }} \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath uitest.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee uitest.log | grep -E "Test Case|error:|failed|passed|\*\*" || true
          grep -qE "TEST (EXECUTE )?SUCCEEDED" uitest.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-ui-shard-${{ matrix.shard }}
          path: |
            build.log
            uitest.log
            uitest.xcresult

  # Reports the required "Build & test (iOS Simulator)" check. It passes when the
  # unit tests and every UI shard pass, and for docs-only changes, where those
  # jobs are skipped.
  ios:
    name: Build & test (iOS Simulator)
    needs: [changes, unit-tests, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          UNIT: ${{ needs.unit-tests.result }}
          UI: ${{ needs.ui-tests.result }}
        run: |
          echo "changes=$CHANGES code=$CODE unit-tests=$UNIT ui-tests=$UI"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" != "true" ]; then
            echo "Docs-only change: iOS jobs skipped."
            exit 0
          fi
          [ "$UNIT" = success ] && [ "$UI" = success ]

  ipad:
    name: Test (iPadOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries
            | map(select(.key | test("iOS-[0-9]+")))
            | sort_by(.key | capture("iOS-(?<v>[0-9]+)").v | tonumber) | reverse
            | .[].value[] | select(.name | startswith("iPad"))][0].udid')
          test "$UDID" != null
          echo "device=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Test iPad navigation and compact windows
        run: |
          set -o pipefail
          xcodebuild test -project FitnessApp.xcodeproj -scheme FitnessApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -only-testing:FitnessAppUITests/IPadSupportTests \
            -only-testing:FitnessAppUITests/IPadScreenshotTests/testSwitchingToCompactKeepsSectionAndSheet \
            -parallel-testing-enabled NO -resultBundlePath ipad.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" > ipad.log 2>&1 || {
              tail -100 ipad.log; exit 1;
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-results
          path: |
            ipad.log
            ipad.xcresult

  macos:
    name: Build & test (native macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Build and test native Mac app
        run: |
          set -o pipefail
          xcodebuild test -project FitnessApp.xcodeproj -scheme StrideMac \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -resultBundlePath macos.xcresult CODE_SIGNING_ALLOWED=NO \
            > macos.log 2>&1 || { tail -120 macos.log; exit 1; }
      - name: Check the Mac app has the USDA key entry
        run: |
          # CI builds without a key, so the value is empty, but the entry must exist
          # for builds that do set USDA_API_KEY (#390).
          DIR=$(xcodebuild -project FitnessApp.xcodeproj -scheme StrideMac -destination 'platform=macOS' -configuration Debug \
            -showBuildSettings 2>/dev/null | awk '/^ *BUILT_PRODUCTS_DIR =/ {print $3; exit}')
          PLIST="$DIR/Stride.app/Contents/Info.plist"
          echo "Checking $PLIST"
          /usr/libexec/PlistBuddy -c 'Print :USDAAPIKey' "$PLIST" >/dev/null
      - name: Export Mac UI screenshots
        if: always()
        run: |
          if [ -d macos.xcresult ]; then
            xcrun xcresulttool export attachments --path macos.xcresult --output-path macos-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-results
          path: |
            macos.log
            macos.xcresult
            macos-screenshots
