name: Release builds

# Builds the 1.0 iPhone/iPad (.ipa, unsigned) and Mac (.dmg, ad-hoc signed) artifacts.
# Runs on demand and on version tags, uploads both files as workflow artifacts, and does not
# publish a GitHub release. Publishing stays a manual step.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, mac]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Build artifact
        run: scripts/build-release.sh ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stride-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
